<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — PhishingGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0e1a; --panel:#111827; --border:#1e2d45; --accent:#00d4ff; --accent2:#ff3c6e; --green:#00ff88; --text:#e2e8f0; --muted:#64748b; --sidebar-w:240px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); font-family:'Syne',sans-serif; color:var(--text); display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar-w); background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100; }
    .sidebar-logo { padding:28px 24px; border-bottom:1px solid var(--border); }
    .sidebar-logo .name { font-size:18px; font-weight:800; }
    .sidebar-logo .name span { color:var(--accent); }
    .sidebar-logo .tagline { font-size:11px; color:var(--muted); margin-top:2px; }
    .nav { flex:1; padding:20px 12px; }
    .nav-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; color:var(--muted); transition:all .2s; text-decoration:none; margin-bottom:4px; }
    .nav-item:hover { background:rgba(0,212,255,0.07); color:var(--text); }
    .nav-item.active { background:rgba(0,212,255,0.12); color:var(--accent); }
    .nav-item .icon { font-size:18px; width:22px; text-align:center; }
    .sidebar-user { padding:16px 20px; border-top:1px solid var(--border); }
    .user-badge { display:flex; align-items:center; gap:10px; }
    .user-avatar-sm { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:#000; flex-shrink:0; }
    .user-name { font-size:13px; font-weight:600; }
    .user-email { font-size:11px; color:var(--muted); }
    .logout-btn { margin-top:12px; width:100%; padding:8px; background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:12px; font-family:'Syne',sans-serif; cursor:pointer; transition:all .2s; }
    .logout-btn:hover { border-color:var(--accent2); color:var(--accent2); }
    .main { margin-left:var(--sidebar-w); flex:1; padding:32px; max-width:800px; }
    .page-header { margin-bottom:32px; }
    .page-header h1 { font-size:28px; font-weight:800; }
    .page-header p { color:var(--muted); font-size:14px; margin-top:4px; }

    .profile-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px; margin-bottom:24px; }
    .avatar-big { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent2)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:32px; color:#000; margin-bottom:16px; }
    .profile-name { font-size:24px; font-weight:800; }
    .profile-email { color:var(--muted); font-size:14px; margin-top:4px; }
    .profile-since { font-size:12px; color:var(--muted); margin-top:8px; font-family:'Space Mono',monospace; }

    .stats-row { display:flex; gap:20px; margin-top:24px; }
    .mini-stat { flex:1; background:#0d1525; border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
    .mini-stat-num { font-size:28px; font-weight:800; font-family:'Space Mono',monospace; color:var(--accent); }
    .mini-stat-label { font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }

    .section-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }
    .field { margin-bottom:18px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    input {
      width:100%; background:#0d1525; border:1px solid var(--border); border-radius:8px;
      padding:12px 16px; font-family:'Space Mono',monospace; font-size:14px;
      color:var(--text); outline:none; transition:border-color .2s;
    }
    input:focus { border-color:var(--accent); }
    input:disabled { opacity:0.5; cursor:not-allowed; }
    .btn { padding:12px 24px; background:linear-gradient(135deg,var(--accent),#0088aa); border:none; border-radius:8px; color:#000; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .btn:hover { opacity:.85; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .msg { padding:10px 14px; border-radius:6px; font-size:13px; margin-top:12px; display:none; }
    .msg-ok { background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.25); color:var(--green); }
    .msg-err { background:rgba(255,60,110,0.1); border:1px solid rgba(255,60,110,0.25); color:var(--accent2); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="name">Phishing<span>Guard</span></div>
      <div class="tagline">Real-time threat protection</div>
    </div>
    <div class="nav">
      <a href="/dashboard" class="nav-item"><span class="icon">📊</span> Dashboard</a>
      <a href="/history" class="nav-item"><span class="icon">🕓</span> Scan History</a>
      <a href="/profile" class="nav-item active"><span class="icon">👤</span> Profile</a>
    </div>
    <div class="sidebar-user">
      <div class="user-badge">
        <div class="user-avatar-sm" id="userInitial">?</div>
        <div>
          <div class="user-name" id="sidebarName">Loading…</div>
          <div class="user-email" id="sidebarEmail"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>My Profile</h1>
      <p>Manage your account details</p>
    </div>

    <div class="profile-card">
      <div class="avatar-big" id="avatarBig">?</div>
      <div class="profile-name" id="profileName">—</div>
      <div class="profile-email" id="profileEmail">—</div>
      <div class="profile-since" id="profileSince">Member since —</div>

      <div class="stats-row">
        <div class="mini-stat">
          <div class="mini-stat-num" id="pTotal">—</div>
          <div class="mini-stat-label">Total Scans</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-num" id="pThreats" style="color:var(--accent2)">—</div>
          <div class="mini-stat-label">Threats Blocked</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-num" id="pSafe" style="color:var(--green)">—</div>
          <div class="mini-stat-label">Safe Sites</div>
        </div>
      </div>
    </div>

    <div class="profile-card">
      <div class="section-title">Account Information</div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="editName" disabled>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="editEmail" disabled>
      </div>
      <div id="infoMsg" class="msg"></div>
      <div style="display:flex;gap:12px;margin-top:4px">
        <button class="btn" id="editBtn" onclick="toggleEdit()">Edit Profile</button>
        <button class="btn" id="saveBtn" onclick="saveProfile()" style="display:none">Save Changes</button>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:5000';
    const token = localStorage.getItem('pd_token');
    if (!token) window.location.href = '/login';

    function logout() {
      localStorage.removeItem('pd_token'); localStorage.removeItem('pd_user');
      window.location.href = '/login';
    }

    let editing = false;
    function toggleEdit() {
      editing = !editing;
      document.getElementById('editName').disabled = !editing;
      document.getElementById('editEmail').disabled = !editing;
      document.getElementById('editBtn').textContent = editing ? 'Cancel' : 'Edit Profile';
      document.getElementById('saveBtn').style.display = editing ? '' : 'none';
    }

    async function loadProfile() {
      const res = await fetch(`${API}/api/auth/me`, { headers: {'Authorization':'Bearer '+token} });
      if (res.status === 401) { logout(); return; }
      const u = await res.json();

      document.getElementById('avatarBig').textContent = u.name[0].toUpperCase();
      document.getElementById('userInitial').textContent = u.name[0].toUpperCase();
      document.getElementById('profileName').textContent = u.name;
      document.getElementById('profileEmail').textContent = u.email;
      document.getElementById('sidebarName').textContent = u.name;
      document.getElementById('sidebarEmail').textContent = u.email;
      document.getElementById('profileSince').textContent = 'Member since ' + new Date(u.created_at).toLocaleDateString();
      document.getElementById('editName').value = u.name;
      document.getElementById('editEmail').value = u.email;
      document.getElementById('pTotal').textContent = u.total_scans;
      document.getElementById('pThreats').textContent = u.threats_blocked;
      document.getElementById('pSafe').textContent = u.total_scans - u.threats_blocked;
    }

    function saveProfile() {
      // Placeholder — extend with a PATCH /api/auth/profile endpoint as needed
      const msg = document.getElementById('infoMsg');
      msg.textContent = 'Profile update coming soon!';
      msg.className = 'msg msg-ok';
      msg.style.display = 'block';
      toggleEdit();
      setTimeout(() => msg.style.display = 'none', 3000);
    }

    loadProfile();
  </script>
</body>
</html>
