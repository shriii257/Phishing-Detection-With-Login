<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Phishing Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #111827;
      --border: #1e2d45;
      --accent: #00d4ff;
      --accent2: #ff3c6e;
      --green: #00ff88;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ff3c6e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Animated grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .orb1 { width:400px; height:400px; background:rgba(0,212,255,0.07); top:-100px; left:-100px; }
    .orb2 { width:300px; height:300px; background:rgba(255,60,110,0.07); bottom:-80px; right:-80px; }

    .card {
      position: relative; z-index: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 44px;
      width: 420px;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,212,255,0.05);
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-text span { color: var(--accent); }

    h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

    .field { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    input {
      width: 100%;
      background: #0d1525;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #0088aa);
      border: none;
      border-radius: 8px;
      color: #000;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
    .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(255,60,110,0.1);
      border: 1px solid rgba(255,60,110,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--accent2);
      margin-bottom: 20px;
      display: none;
    }
    .success-msg {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--green);
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">Phishing<span>Guard</span></div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to view your threat dashboard</p>

    <div id="error" class="error-msg"></div>
    <div id="success" class="success-msg"></div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In →</button>

    <div class="footer-link">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000';

    // Redirect if already logged in
    if (localStorage.getItem('pd_token')) window.location.href = '/dashboard';

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('error');
      const sucEl = document.getElementById('success');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      if (!email || !password) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('pd_token', data.token);
        localStorage.setItem('pd_user', JSON.stringify(data.user));
        sucEl.textContent = 'Login successful! Redirecting…';
        sucEl.style.display = 'block';
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch(e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In →';
      }
    }

    document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
