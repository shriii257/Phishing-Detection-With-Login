<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Phishing Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a; --panel: #111827; --border: #1e2d45;
      --accent: #00d4ff; --accent2: #ff3c6e; --green: #00ff88;
      --text: #e2e8f0; --muted: #64748b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg); font-family: 'Syne', sans-serif;
      color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .glow-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; z-index:0; }
    .orb1 { width:400px; height:400px; background:rgba(0,255,136,0.06); top:-100px; right:-80px; }
    .orb2 { width:300px; height:300px; background:rgba(0,212,255,0.07); bottom:-80px; left:-80px; }

    .card {
      position:relative; z-index:1; background:var(--panel);
      border:1px solid var(--border); border-radius:16px;
      padding:48px 44px; width:420px;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,136,0.05);
    }
    .logo { display:flex; align-items:center; gap:12px; margin-bottom:36px; }
    .logo-icon { width:44px; height:44px; background:linear-gradient(135deg, var(--green), var(--accent)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .logo-text { font-size:20px; font-weight:800; letter-spacing:-0.5px; }
    .logo-text span { color: var(--green); }

    h2 { font-size:26px; font-weight:800; margin-bottom:6px; }
    .subtitle { color:var(--muted); font-size:14px; margin-bottom:32px; }
    .field { margin-bottom:20px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    input {
      width:100%; background:#0d1525; border:1px solid var(--border); border-radius:8px;
      padding:12px 16px; font-family:'Space Mono',monospace; font-size:14px;
      color:var(--text); outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(0,255,136,0.1); }
    input::placeholder { color:var(--muted); }

    .password-strength { margin-top:8px; height:4px; border-radius:2px; background:var(--border); overflow:hidden; }
    .strength-bar { height:100%; width:0%; transition:width .3s, background .3s; border-radius:2px; }

    .btn {
      width:100%; padding:14px;
      background:linear-gradient(135deg, var(--green), #00aa66);
      border:none; border-radius:8px; color:#000;
      font-family:'Syne',sans-serif; font-size:15px; font-weight:700;
      cursor:pointer; letter-spacing:0.5px; transition:opacity .2s, transform .1s; margin-top:8px;
    }
    .btn:hover { opacity:.9; transform:translateY(-1px); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }

    .footer-link { text-align:center; margin-top:24px; font-size:14px; color:var(--muted); }
    .footer-link a { color:var(--accent); text-decoration:none; font-weight:600; }
    .error-msg { background:rgba(255,60,110,0.1); border:1px solid rgba(255,60,110,0.3); border-radius:8px; padding:12px 16px; font-size:13px; color:var(--accent2); margin-bottom:20px; display:none; }
    .success-msg { background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.25); border-radius:8px; padding:12px 16px; font-size:13px; color:var(--green); margin-bottom:20px; display:none; }
  </style>
</head>
<body>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">Phishing<span>Guard</span></div>
    </div>

    <h2>Create account</h2>
    <p class="subtitle">Start tracking and protecting your browsing</p>

    <div id="error" class="error-msg"></div>
    <div id="success" class="success-msg"></div>

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" oninput="checkStrength(this.value)">
      <div class="password-strength"><div class="strength-bar" id="strengthBar"></div></div>
    </div>

    <button class="btn" id="regBtn" onclick="doRegister()">Create Account →</button>

    <div class="footer-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000';
    if (localStorage.getItem('pd_token')) window.location.href = '/dashboard';

    function checkStrength(pw) {
      const bar = document.getElementById('strengthBar');
      let score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 10) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const pct = (score / 5) * 100;
      const colors = ['#ff3c6e','#ff7b3c','#ffc107','#00d4ff','#00ff88'];
      bar.style.width = pct + '%';
      bar.style.background = colors[score - 1] || '#ff3c6e';
    }

    async function doRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('regBtn');
      const errEl = document.getElementById('error');
      const sucEl = document.getElementById('success');
      errEl.style.display = 'none'; sucEl.style.display = 'none';

      if (!name || !email || !password) {
        errEl.textContent = 'Please fill in all fields.'; errEl.style.display = 'block'; return;
      }

      btn.disabled = true; btn.textContent = 'Creating account…';

      try {
        const res = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        localStorage.setItem('pd_token', data.token);
        localStorage.setItem('pd_user', JSON.stringify(data.user));
        sucEl.textContent = 'Account created! Redirecting to dashboard…';
        sucEl.style.display = 'block';
        setTimeout(() => window.location.href = '/dashboard', 900);
      } catch(e) {
        errEl.textContent = e.message; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create Account →';
      }
    }
    document.addEventListener('keypress', e => { if (e.key === 'Enter') doRegister(); });
  </script>
</body>
</html>
